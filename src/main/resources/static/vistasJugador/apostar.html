<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Confirmar Apuesta</title>
  <link rel="stylesheet" href="/vistasJugador/apostar.css">
  <link rel="stylesheet" href="/vistasJugador/tableroJugador.css">
</head>
<body class="root">
  <div class="container">
    <div id="errorArea" class="error" style="display:none"></div>
    <div class="card">
      <div class="heading">
        <h2>Confirmar Apuesta</h2>
      </div>

      <div class="section">
        <div class="row"><div class="label">N° de Carrera</div><div class="value" id="numCarrera">-</div></div>
        <div class="row"><div class="label">Caballo</div><div class="value" id="nombreCaballo">-</div></div>
        <div class="row"><div class="label">Tipo de Apuesta</div><div class="value"><span id="tipoApuesta" class="badgeTipo">-</span></div></div>
        <div class="row"><div class="label">Dividendo Actual</div><div class="value" id="dividendoActual">-</div></div>
        <div class="row"><div class="label">Monto Apostado</div><div class="value"><input id="montoInput" type="number" min="0" step="1" value="0" style="width:140px;text-align:right"></div></div>
        <div class="row"><div class="label">Monto a debitar del saldo</div><div class="value"><span id="montoADebitarDisplay">$0</span></div></div>
      </div>

      <div class="resultBox">
        <div class="muted">COBRARÍAS SI EL CABALLO GANA</div>
        <div style="font-size:28px;font-weight:800" id="montoACobrarDisplay">$0</div>
        <div class="muted">Cálculo realizado en base al dividendo actual. El monto final puede variar</div>
      </div>

      <div class="section">
        <div class="label">INGRESAR CONTRASEÑA</div>
        <div style="margin-top:8px" class="inputInline">
          <input id="pass" type="password" placeholder="Contraseña">
        </div>
      </div>

      <div style="margin-top:12px" class="center">
        <button id="btnConfirmar" class="btnConfirm">Confirmar Apuesta</button>
      </div>

      <div style="margin-top:10px" class="center">
        <button id="btnDescartar" class="btnSecondary">Descartar Apuesta</button>
      </div>

    </div>
  </div>

  <script type="module">
    import dispatcher from '/CommandDispatcher.js';

    function mostrarError(msg){
      const el = document.getElementById('errorArea');
      el.textContent = typeof msg === 'string' ? msg : (msg?.message || JSON.stringify(msg));
      el.style.display = 'block';
      if(el._hide) clearTimeout(el._hide);
      el._hide = setTimeout(()=> el.style.display='none',6000);
    }

    const view = dispatcher.registerView('apostar', {
      urlInicio: '/apuestaJugador/vistaConectada',
      onError: (s,t) => mostrarError(`Error ${s}: ${t}`),
      onException: (m) => mostrarError(m)
    });

    view.handler('accesoNoPermitido', (dest) => { window.location.href = dest; });
    view.handler('Volver al tablero', (dest) => { window.location.href = dest; });
    view.handler('Mensaje de error: ', (msg) => mostrarError(msg));

    view.handler('Numero de la carrera', (n) => { document.getElementById('numCarrera').textContent = n || '-'; });
    view.handler('Nombre de la carrera', (n) => { /* not shown separately in UI but keep available */ });
    view.handler('Nombre del caballo', (n) => { document.getElementById('nombreCaballo').textContent = n || '-'; });
    view.handler('Modalidad', (m) => { document.getElementById('tipoApuesta').textContent = m || '-'; });
    view.handler('Dividendo actual', (d) => { 
      document.getElementById('dividendoActual').textContent = (d === -1 || d === '-1') ? 'N/A' : formatMoney(d);
      currentDividendo = (d === -1 || d === '-1') ? null : Number(d);
      updateMontoACobrar();
    });
    view.handler('Monto a cobrar si es ganadora', (v) => { document.getElementById('montoACobrarDisplay').textContent = formatMoney(v); });

    // monto input visible and synced
    const montoInput = document.getElementById('montoInput');
    function updateMontos(valor){
      const monto = Number(valor) || 0;
      // show formatted in debitar display and keep raw in input
      document.getElementById('montoADebitarDisplay').textContent = formatMoney(monto);
    }
    // compute monto a cobrar locally as valor * dividendo (frontend approximation)
    let currentDividendo = null;
    function updateMontoACobrar(){
      const valor = Number(montoInput.value || 0);
      const divid = Number(currentDividendo || 0);
      const posible = (valor && divid) ? (valor * divid) : 0;
      document.getElementById('montoACobrarDisplay').textContent = formatMoney(posible);
    }

    montoInput.addEventListener('input', (e) => { updateMontos(e.target.value); updateMontoACobrar(); });
    // initialize
    updateMontos(montoInput.value);

    document.getElementById('btnConfirmar').addEventListener('click', ()=>{
      const valor = Number(montoInput.value || 0);
      const pass = document.getElementById('pass').value || '';
      if(valor <= 0){ mostrarError('Ingrese un monto válido mayor que 0'); return; }
      if(!pass){ mostrarError('Ingrese su contraseña para confirmar'); return; }
      dispatcher.submit('/apuestaJugador/confirmarApuesta', { valorApuesta: valor, pass });
    });

    document.getElementById('btnDescartar').addEventListener('click', ()=>{
      dispatcher.submit('/apuestaJugador/descartarApuesta');
    });

    function formatMoney(v){
      if(v===null||v===undefined) return '$0';
      if(typeof v==='number') return '$'+new Intl.NumberFormat('es-UY',{maximumFractionDigits:0}).format(Math.round(v));
      const cleaned = String(v).replace(/[^0-9,.-]/g,'').replace(/\./g,'').replace(/,/g,'.');
      const num = parseFloat(cleaned);
      if(!isNaN(num)) return '$'+new Intl.NumberFormat('es-UY',{maximumFractionDigits:0}).format(Math.round(num));
      return String(v);
    }

    dispatcher.startView(view);
  </script>
</body>
</html>
