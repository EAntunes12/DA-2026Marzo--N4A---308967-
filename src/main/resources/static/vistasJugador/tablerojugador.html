<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tablero Jugador</title>
  <link rel="stylesheet" href="/vistasJugador/tableroJugador.css">
  <style>/* fallback fonts if needed */</style>
</head>
<body class="root">

  <div id="errorArea" class="errorArea"><span id="errorMsg"></span></div>

  <nav class="navbar">
    <div class="playerCard">
      <div class="playerInfo">
        <div class="playerName" id="playerName">Jugador</div>
        <div class="balances">
          <div class="badge">Saldo: <span id="saldo">-</span></div>
          <div class="badge">Total Apostado: <span id="totalApostado">-</span></div>
          <div class="badge">Total Ganado: <span id="totalGanado">-</span></div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="btnLogout" class="btn">Cerrar sesión</button>
    </div>
  </nav>

  <h3 style="color:#a7c6d6">Carreras Disponibles para Apostar</h3>

  <div class="grid" id="carrerasGrid">
    <!-- cards generated dynamically -->
  </div>

  <div class="small">Tipos de Apuesta disponibles</div>
  <div class="tipoApuestas" id="tiposApuestaArea"></div>

  <h3 style="color:#a7c6d6">Mis Apuestas</h3>
  <table class="apuestasTable" id="tablaApuestas">
    <thead>
      <tr><th>Fecha</th><th>N° Carrera</th><th>Caballo</th><th>Monto</th><th>Tipo</th><th>Estado</th></tr>
    </thead>
    <tbody>
      <tr><td colspan="6" class="small">No hay apuestas</td></tr>
    </tbody>
  </table>

  

  <script type="module">
    import dispatcher from '/CommandDispatcher.js';

    function mostrarError(msg){
      const area = document.getElementById('errorArea');
      const span = document.getElementById('errorMsg');
      span.textContent = typeof msg === 'string' ? msg : (msg?.message || JSON.stringify(msg));
      area.style.display = 'block';
      if(area._hideTimeout) clearTimeout(area._hideTimeout);
      area._hideTimeout = setTimeout(()=> area.style.display='none',6000);
    }

    const view = dispatcher.registerView('tableroJugador', {
      urlInicio: '/tableroJugador/vistaConectada',
      onError: (s,t) => mostrarError(`Error ${s}: ${t}`),
      onException: (m) => mostrarError(m)
    });

    // Handler: redirect to login if access denied
    view.handler('accesoNoPermitido', (dest)=> { window.location.href = dest; });
    view.handler('Vista apostar', (dest)=> { window.location.href = dest; });

    view.handler('Datos del jugador', (nombre) => {
      document.getElementById('playerName').textContent = nombre || 'Jugador';
    });

    // Nuevo handler para mostrar el saldo enviado por el presentador
    view.handler('Saldo', (v) => {
      const el = document.getElementById('saldo');
      el.textContent = formatMoney(v);
    });

    view.handler('Total apostado', (v) => {
      const el = document.getElementById('totalApostado');
      const txt = formatMoney(v);
      el.textContent = txt;
    });

    view.handler('Total ganado', (v) => {
      const el = document.getElementById('totalGanado');
      const txt = formatMoney(v);
      el.textContent = txt;
    });

    view.handler('Modalidades de apuesta', (lista) => {
      const area = document.getElementById('tiposApuestaArea');
      area.innerHTML='';
      if(!Array.isArray(lista)) lista = lista ? [lista] : [];
      lista.forEach(m => {
        const b = document.createElement('button');
        b.className='tipoBtn';
        const nombre = typeof m === 'string' ? m : (m?.nombre || m?.toString());
        b.textContent = nombre;
        b.dataset.modalidad = nombre;
        b.addEventListener('click', ()=>{
          document.querySelectorAll('.tipoBtn').forEach(x=>x.classList.remove('selected'));
          b.classList.add('selected');
        });
        area.appendChild(b);
      });
    });

    view.handler('Mensaje de error', (msg) => {
      mostrarError(msg);
    });

    view.handler('Carreras disponibles', (carreras) => {
      const grid = document.getElementById('carrerasGrid');
      grid.innerHTML = '';
      if(!Array.isArray(carreras)) carreras = carreras ? [carreras] : [];
      carreras.forEach(c => {
        const card = document.createElement('div'); card.className='card';
        const header = document.createElement('div'); header.className='cardHeader';
        const title = document.createElement('div'); title.className='cardTitle';
        title.textContent = `${c.numero || ''} ${c.nombre || ''}`;
        const date = document.createElement('div'); date.className='small'; date.textContent = c.fecha || '';
        header.appendChild(title); header.appendChild(date);
        card.appendChild(header);

        const table = document.createElement('table'); table.className='tableMini';
        const thead = document.createElement('thead'); thead.innerHTML = '<tr><th>N°</th><th>Caballo</th><th style="text-align:right">Dividendo</th></tr>';
        table.appendChild(thead);
        const tbody = document.createElement('tbody');
        const parts = c.participaciones || c.participaciones || [];
        (parts).forEach(p => {
          const tr = document.createElement('tr');
          const nro = document.createElement('td'); nro.textContent = p.nroRegistro || p.numeroRegistro || p.nro || '';
          const caballo = document.createElement('td');
          const caballoNombre = (p.caballo && (p.caballo.nombre || p.caballo.getNombre)) ? (p.caballo.nombre || p.caballo.getNombre) : (p.caballo || '');
          caballo.textContent = caballoNombre;
          const divi = document.createElement('td'); divi.style.textAlign='right';
          const rawDiv = p.dividendo !== undefined ? p.dividendo : (p.getDividendo !== undefined ? p.getDividendo : null);
          if(rawDiv === -1 || rawDiv === '-1'){
            divi.textContent = 'N/A';
          } else {
            divi.textContent = formatDouble(rawDiv);
          }
          // make row selectable and store caballo name, nroRegistro and carrera id
          tr.dataset.caballo = caballoNombre;
          tr.dataset.nroRegistro = p.nroRegistro || p.numeroRegistro || p.nro || '';
          tr.dataset.carreraId = c.id;
          tr.addEventListener('click', () => {
            // deselect todas las filas en la vista (selección global)
            document.querySelectorAll('.tableMini tbody tr.partSelected').forEach(r => r.classList.remove('partSelected'));
            tr.classList.add('partSelected');
          });
          tr.appendChild(nro); tr.appendChild(caballo); tr.appendChild(divi);
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        card.appendChild(table);

        const foot = document.createElement('div'); foot.style.marginTop='10px';
        const btn = document.createElement('button'); btn.className='btn'; btn.textContent='Apostar';
        btn.addEventListener('click', ()=>{
          // selección global: buscar fila seleccionada en toda la vista
          const selectedRow = document.querySelector('.tableMini tbody tr.partSelected');
          if(!selectedRow){ mostrarError('Seleccione un caballo antes de apostar'); return; }
          const nroSeleccionado = selectedRow.dataset.nroRegistro;
          const carreraSeleccionadaId = selectedRow.dataset.carreraId;
          if(!nroSeleccionado){ mostrarError('Error interno: participación no identificada'); return; }
          if(String(carreraSeleccionadaId) !== String(c.id)){
            mostrarError('Seleccione una participación de esta misma carrera antes de apostar');
            return;
          }
          const selModal = document.querySelector('.tipoBtn.selected');
          const modalidad = selModal ? selModal.dataset.modalidad : null;
          if(!modalidad){ mostrarError('Seleccione una modalidad antes de apostar'); return; }
          const payload = { idCarrera: c.id, modalidad, nroRegistro: Number(nroSeleccionado) };
          dispatcher.submit('/tableroJugador/apostar', payload);
        });
        foot.appendChild(btn);
        card.appendChild(foot);

        grid.appendChild(card);
      });
    });

    view.handler('Apuestas del jugador', (apuestas) => {
      const tbody = document.getElementById('tablaApuestas').querySelector('tbody');
      tbody.innerHTML='';
      if(!Array.isArray(apuestas)) apuestas = apuestas ? [apuestas] : [];
      if(apuestas.length===0){ tbody.innerHTML='<tr><td colspan="6" class="small">No hay apuestas</td></tr>'; return; }
      apuestas.forEach(a => {
        const tr = document.createElement('tr');
        const fecha = document.createElement('td'); fecha.textContent = (a.apuesta && (a.apuesta.fecha || a.apuesta.fechaOperacion)) ? (a.apuesta.fecha || a.apuesta.fechaOperacion) : '-';
        const nro = document.createElement('td'); nro.textContent = a.apuesta?.participacion?.numeroCarrera ?? '';
        const caballo = document.createElement('td'); caballo.textContent = a.apuesta?.participacion?.caballo?.nombre || a.apuesta?.participacion?.caballo || '';
        const monto = document.createElement('td'); monto.textContent = formatMoney(a.apuesta?.valor ?? a.valor);
        const tipo = document.createElement('td'); tipo.textContent = a.apuesta?.modalidad?.nombre || (a.apuesta?.modalidad?String(a.apuesta.modalidad):'');
        const estado = document.createElement('td'); estado.innerHTML = `<span class="status done">${a.estadoCarrera || (a.apuesta?.estadoCarrera || '')}</span>`;
        tr.appendChild(fecha); tr.appendChild(nro); tr.appendChild(caballo); tr.appendChild(monto); tr.appendChild(tipo); tr.appendChild(estado);
        tbody.appendChild(tr);
      });
    });

    // utility
    function formatMoney(v){
      if(v===null||v===undefined) return '-';
      if(typeof v==='number') return '$'+new Intl.NumberFormat('es-UY',{maximumFractionDigits:0}).format(Math.round(v));
      const cleaned = String(v).replace(/[^0-9,.-]/g,'').replace(/\./g,'').replace(/,/g,'.');
      const num = parseFloat(cleaned);
      if(!isNaN(num)) return '$'+new Intl.NumberFormat('es-UY',{maximumFractionDigits:0}).format(Math.round(num));
      return String(v);
    }

    function formatDouble(v){
      if(v===null||v===undefined) return '-';
      if(v === 'N/A') return 'N/A';
      const cleaned = String(v).replace(/,/g,'.');
      const num = parseFloat(cleaned);
      if(isNaN(num)) return String(v);
      let s = num.toFixed(2);
      s = s.replace(/\.00$/,'');
      s = s.replace(/(\.\d)0$/,'$1');
      return s;
    }

    // logout
    document.getElementById('btnLogout').addEventListener('click', ()=> dispatcher.submit('/tableroJugador/logout'));

    // Start view immediately, then open SSE in background to receive presenter's actualizar() notifications
    dispatcher.startView(view);

    const SSE_URL = '/tableroJugador/registrarSSE';
    let eventSource = null;
    let reconnectAttempts = 0;

    function setupSSE() {
      return new Promise((resolve) => {
        try {
          eventSource = new EventSource(SSE_URL, { withCredentials: true });

          eventSource.onopen = () => {
            console.debug('SSE connected to', SSE_URL);
            reconnectAttempts = 0;
            resolve();
          };

          eventSource.onmessage = (ev) => {
            console.log("SSE recibido:", ev.data);
            try {
              if (!ev.data) return;
              const json = JSON.parse(ev.data);
              if (json && (json.commands || Array.isArray(json))) {
                if (json.commands) dispatcher.processCommands(json);
                else dispatcher.processCommands({ commands: json });
              } else {
                console.warn('SSE message ignored, unexpected payload', json);
              }
            } catch (e) {
              console.error('Error parsing SSE message', e, ev.data);
            }
          };

          eventSource.onerror = (err) => {
            console.warn('SSE error, attempting reconnect', err);
            try { eventSource.close(); } catch(e){}
            eventSource = null;
            reconnectAttempts++;
            const timeout = Math.min(30000, 1000 * Math.pow(2, Math.min(reconnectAttempts, 6)));
            setTimeout(() => setupSSE(), timeout);
          };
        } catch (e) {
          console.error('SSE setup failed', e);
          resolve();
        }
      });
    }

    window.addEventListener('beforeunload', () => {
      try { if (eventSource) eventSource.close(); } catch(e){}
    });

    // open SSE in background (do not block startView)
    setupSSE().catch(() => {});
  </script>
</body>
</html>
